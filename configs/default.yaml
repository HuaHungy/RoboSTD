# General Configuration
project_name: "RoboSTD_Unified"
log_level: "INFO"

# Dataset Configuration
dataset:
  input_path: "data/raw"
  output_path: "data/output"
  train_split: 0.8
  val_split: 0.1
  test_split: 0.1

# Joint Processing Rules (Mirror Mappings)
joint_mirror_rules:
  aloha:
    - source: left_waist
      target: right_waist
      scale: -1.0
    - source: right_waist
      target: left_waist
      scale: -1.0
    - source: left_shoulder
      target: right_shoulder
      scale: 1.0
    - source: right_shoulder
      target: left_shoulder
      scale: 1.0
    - source: left_elbow
      target: right_elbow
      scale: 1.0
    - source: right_elbow
      target: left_elbow
      scale: 1.0
    - source: left_forearm_roll
      target: right_forearm_roll
      scale: 1.0
    - source: right_forearm_roll
      target: left_forearm_roll
      scale: 1.0
    - source: left_wrist_angle
      target: right_wrist_angle
      scale: -1.0
    - source: right_wrist_angle
      target: left_wrist_angle
      scale: -1.0
    - source: left_wrist_rotate
      target: right_wrist_rotate
      scale: -1.0
    - source: right_wrist_rotate
      target: left_wrist_rotate
      scale: -1.0
    - source: left_gripper
      target: right_gripper
      scale: 1.0
    - source: right_gripper
      target: left_gripper
      scale: 1.0

