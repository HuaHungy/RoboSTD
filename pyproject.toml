[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robostd-unified"
version = "0.1.0"
description = "Unified Robotic Video and Joint Processing Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "opencv-python==4.10.0.84",
    "pandas>=1.3.0",
    "numpy>=1.20.0",
    "pyarrow>=23.0.0",
    "PyYAML>=5.4.0",
    "h5py>=3.0.0",
    "matplotlib>=3.5.0",
    "scipy>=1.7.0",
    "mujoco>=3.0.0",
    "av>=10.0.0",
    "rerun-sdk==0.26.1",
    "openai>=1.40.0,<3",
]

[project.scripts]
robostd = "scripts.main:main"

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tools/tests",
]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
